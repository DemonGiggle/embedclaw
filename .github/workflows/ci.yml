name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: posix
            platform: POSIX
            host_sim: OFF
            ctest_regex: e2e|unit|baremetal-hal|telnet-io
          - name: host-sim
            platform: POSIX
            host_sim: ON
            ctest_regex: e2e|unit|baremetal-hal|host-sim|telnet-io
          - name: baremetal
            platform: BAREMETAL
            host_sim: OFF
            ctest_regex: ''

    name: ${{ matrix.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DEC_PLATFORM=${{ matrix.platform }}
          -DEC_ENABLE_TLS=OFF
          -DEC_HOST_SIM=${{ matrix.host_sim }}

      - name: Build
        run: cmake --build build

      - name: Test
        if: matrix.ctest_regex != ''
        run: ctest --test-dir build --output-on-failure -R '${{ matrix.ctest_regex }}'
